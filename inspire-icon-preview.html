<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「灵感」入口图标候选预览</title>
<style>
  :root {
    --bg: #1a0f2e;
    --card: rgba(255,255,255,.04);
    --border: rgba(147,112,219,.35);
    --stroke: #e8dff5;
    --label: #c8b8e8;
    --accent: #c9a3ff;
    --muted: rgba(224,208,240,.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 24px 60px;
    background: linear-gradient(160deg, #1e1033 0%, #2d1b4e 40%, #1a0f2e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--stroke);
    min-height: 100vh;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 28px; line-height: 1.6; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 18px;
    max-width: 860px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px 16px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }
  .card.chosen { border-color: var(--accent); box-shadow: 0 0 22px rgba(147,112,219,.35); }
  .badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 11px; color: #fff; background: #7c5cbf;
    padding: 2px 8px; border-radius: 999px;
  }
  .entry {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,.06);
    border: 2px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .entry svg { width: 17px; height: 17px; display: block; }
  .entry .lbl { font-size: 10px; letter-spacing: .5px; color: var(--label); margin-top: 2px; }
  .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .meta { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .meta a { color: var(--accent); text-decoration: none; }
  .license { display: inline-block; font-size: 11px; color: #9fe6a8; margin-top: 4px; }
  .large {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px; max-width: 860px; margin-top: 28px;
    flex-wrap: wrap;
  }
  .large .entry { width: 72px; height: 72px; margin: 0; }
  .large .entry svg { width: 26px; height: 26px; }
  .large .entry .lbl { font-size: 13px; }
  .note { color: var(--muted); font-size: 12px; max-width: 860px; margin-top: 20px; line-height: 1.7; }
</style>
</head>
<body>
  <h1>「灵感」入口图标候选预览</h1>
  <p class="sub">每个候选都按真实入口尺寸（50px 圆形底 + 17px 图标）渲染，配色沿用现有工具入口（描边 #e8dff5、紫色描边圆底）。标注「当前占位」的为已落地的默认项，待用户选定后替换。</p>

  <div class="grid" id="grid"></div>

  <h1 style="margin-top:40px;">放大对比</h1>
  <div class="large" id="large"></div>

  <p class="note">说明：所有候选均取自 <strong>Lucide Icons</strong>（开源图标库，MIT License），24×24 viewBox、描边风格（stroke-width 2、圆角线帽/线接），与现有入口图标「线宽、圆角」观感一致，可免费商用。来源：https://lucide.dev · 许可：ISC/MIT（Lucide 官方声明 ISC，可按 MIT 对待）。</p>

<script>
  var stroke = '#e8dff5';
  var icons = [
    {
      name: '灯泡 Lightbulb',
      chosen: true,
      desc: '最通用的「灵感 / 点子」象征',
      src: 'Lucide Icons',
      href: 'https://lucide.dev/icons/lightbulb',
      license: 'MIT / ISC',
      svg: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>'
    },
    {
      name: '闪烁 Sparkles',
      chosen: false,
      desc: '灵光一现、闪念的星芒',
      src: 'Lucide Icons',
      href: 'https://lucide.dev/icons/sparkles',
      license: 'MIT / ISC',
      svg: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>'
    },
    {
      name: '闪电 Zap',
      chosen: false,
      desc: '瞬间灵感的电光石火',
      src: 'Lucide Icons',
      href: 'https://lucide.dev/icons/zap',
      license: 'MIT / ISC',
      svg: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>'
    },
    {
      name: '大脑 Brain',
      chosen: false,
      desc: '思考、智慧与灵感来源',
      src: 'Lucide Icons',
      href: 'https://lucide.dev/icons/brain',
      license: 'MIT / ISC',
      svg: '<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M3.477 10.082A4.5 4.5 0 0 1 3.6 7.5"/><path d="M20.523 10.082A4.5 4.5 0 0 0 20.4 7.5"/><path d="M3.6 7.5A2 2 0 0 1 3 5.7 2 2 0 0 1 4.5 4"/><path d="M20.4 7.5A2 2 0 0 0 21 5.7 2 2 0 0 0 19.5 4"/>'
    },
    {
      name: '星星 Star',
      chosen: false,
      desc: '灵光、闪耀的记号',
      src: 'Lucide Icons',
      href: 'https://lucide.dev/icons/star',
      license: 'MIT / ISC',
      svg: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
    }
  ];

  function svgWrap(inner) {
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }
  function entryHtml(icon) {
    return '<div class="entry">' + svgWrap(icon.svg) + '<span class="lbl">灵感</span></div>';
  }

  var grid = document.getElementById('grid');
  var large = document.getElementById('large');
  icons.forEach(function (icon) {
    var card = document.createElement('div');
    card.className = 'card' + (icon.chosen ? ' chosen' : '');
    card.innerHTML =
      (icon.chosen ? '<span class="badge">当前占位</span>' : '') +
      entryHtml(icon) +
      '<div class="name">' + icon.name + '</div>' +
      '<div class="meta">' + icon.desc + '</div>' +
      '<div class="meta">来源：<a href="' + icon.href + '" target="_blank">' + icon.src + '</a></div>' +
      '<span class="license">' + icon.license + '</span>';
    grid.appendChild(card);
  });
  icons.forEach(function (icon) {
    large.insertAdjacentHTML('beforeend', entryHtml(icon));
  });
</script>
</body>
</html>
